name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Windows)
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt -r requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest backend/tests -q
      - name: Run Ruff fatal checks
        run: python -m ruff check backend --select F,E9

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test
      - name: Build frontend
        run: npm run build

  sensitive-scan:
    name: Sensitive credential scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan tracked source and documentation
        run: python scripts/scan-sensitive.py .

  package-plugin:
    name: Package and smoke-test plugin
    needs: [backend, frontend, sensitive-scan]
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    env:
      PYTHONUTF8: '1'
      APISWITCH_HARNESS_DATA_DIR: ${{ github.workspace }}\plugin-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Read plugin version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw .codex-plugin/plugin.json | ConvertFrom-Json
          "value=$($manifest.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Validate plugin structure
        shell: pwsh
        run: ./scripts/validate-plugin.ps1
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Start plugin gateway and verify workspace connection
        shell: pwsh
        run: |
          ./scripts/start-plugin.ps1
          New-Item -ItemType Directory -Force smoke-workspace | Out-Null
          ./scripts/connect-harness.ps1 -Workspace ./smoke-workspace
          $runtime = Get-Content -Raw "$env:APISWITCH_HARNESS_DATA_DIR/runtime.json" | ConvertFrom-Json
          $token = (Get-Content -Raw "$env:APISWITCH_HARNESS_DATA_DIR/harness.token").Trim()
          $models = Invoke-RestMethod -Uri "http://127.0.0.1:$($runtime.port)/v1/models" -Headers @{ Authorization = "Bearer $token" }
          if ($models.object -ne 'list') { throw 'Plugin model endpoint failed.' }
          if ((Get-Content -Raw ./smoke-workspace/.env) -notmatch 'DEEPSEEK_BASE_URL=') { throw 'Workspace connection failed.' }
      - name: Stop plugin gateway
        if: always()
        shell: pwsh
        run: ./scripts/stop-plugin.ps1
      - name: Package plugin archive
        shell: pwsh
        run: ./scripts/package-plugin.ps1 -Clean
      - uses: actions/upload-artifact@v4
        with:
          name: APISwitch-DeepSeek-Harness-v${{ steps.version.outputs.value }}
          path: dist/APISwitch-DeepSeek-Harness-v${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: package-plugin
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin archive
        uses: actions/download-artifact@v4
        with:
          name: APISwitch-DeepSeek-Harness-v${{ needs.package-plugin.outputs.version }}
          path: release
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package-plugin.outputs.version }}
        run: |
          tag="v${VERSION}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "APISwitch for DeepSeek Harness $tag" --generate-notes
          fi
          gh release upload "$tag" release/*.zip --clobber
